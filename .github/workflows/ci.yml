name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Eval typecheck
        run: pnpm typecheck:eval

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary rules
        run: pnpm dep:check

      - name: Schema contract
        run: python3 test/contract/test_schema.py

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r test/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Cache daemon build
        id: daemon-cache
        uses: actions/cache@v5
        with:
          path: apps/daemon/dist
          key: daemon-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/daemon/**', 'packages/**') }}
      - name: Build daemon
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        run: pnpm daemon:build
      - name: Six e2e harnesses
        run: pnpm e2e
        env:
          E2E_DAEMON_BUILT: '1'
      - name: Failure logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-failure-${{ github.run_id }}
          path: .e2e-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
