name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Eval typecheck
        run: pnpm typecheck:eval

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary rules
        run: pnpm dep:check

      - name: Schema contract
        run: python3 test/contract/test_schema.py

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r test/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Cache daemon build
        id: daemon-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/daemon/dist
          key: daemon-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/daemon/src/**', 'apps/daemon/build.mjs', 'apps/daemon/package.json', 'packages/*/src/**', 'packages/store/schema/**', '**/tsconfig*.json', 'pnpm-workspace.yaml', 'packages/*/package.json') }}
      - name: Build daemon
        if: steps.daemon-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .e2e-artifacts
          set -o pipefail
          pnpm daemon:build 2>&1 | tee .e2e-artifacts/daemon-build.log
      - name: Runner regression tests
        run: python -m unittest discover -s test/e2e -p "test_runner.py"
      - name: Six e2e harnesses
        run: pnpm e2e
        env:
          E2E_DAEMON_BUILT: '1'
      - name: Failure logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-failure-${{ github.run_id }}
          path: .e2e-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
