name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Eval typecheck
        run: pnpm typecheck:eval

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Boundary rules
        run: pnpm dep:check

      - name: Schema contract
        run: python3 test/contract/test_schema.py
